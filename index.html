<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Case Converter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Text Case Converter</h1>
    <div class="mode-toggle">
      <button id="modeToggle">🌙 Night Mode</button>
    </div>
    <textarea id="inputText" placeholder="Enter your text here..."></textarea>
    <div class="buttons">
      <button id="upperCase">UPPERCASE</button>
      <button id="lowerCase">lowercase</button>
      <button id="sentenceCase">Sentence case</button>
      <button id="titleCase">Title Case</button>
      <button id="alternatingCase">AlTeRnAtInG cAsE</button>
      <button id="inverseCase">InVeRsE CaSe</button>
      <button id="copyText">Copy Text</button>
      <button id="clearText">Clear Text</button>
    </div>
    <textarea id="outputText" readonly placeholder="Your converted text will appear here..."></textarea>
  </div>
  <script src="script.js"></script>
</body>
</html>
